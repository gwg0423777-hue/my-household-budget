<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#20242d">
<title>나의 가계부</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header>
  <div><p class="eyebrow">MY HOUSEHOLD BUDGET</p><h1>나의 가계부</h1></div>
  <div class="header-actions">
    <button id="installBtn" class="ghost" hidden>앱으로 설치</button>
    <button id="resetBtn" class="ghost">전체 초기화</button>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="dashboard">대시보드</button>
  <button class="tab" data-tab="transactions">거래 내역</button>
  <button class="tab" data-tab="debts">부채 관리</button>
</nav>

<section id="dashboard" class="page active">
  <div class="month-row"><div><h2 id="dashMonth"></h2><p>선택한 달의 가계 현황</p></div><input id="dashMonthInput" type="month"></div>
  <section class="summary">
    <div class="card income"><span>이번 달 수입</span><strong id="incomeTotal">₩0</strong></div>
    <div class="card expense"><span>이번 달 지출</span><strong id="expenseTotal">₩0</strong></div>
    <div class="card balance"><span>이번 달 잔액</span><strong id="balanceTotal">₩0</strong></div>
    <div class="card debt"><span>남은 채무</span><strong id="debtTotal">₩0</strong></div>
  </section>
  <div class="dashboard-grid">
    <section class="panel"><h2>카테고리별 지출</h2><div id="categoryBars" class="bars"></div><div id="categoryEmpty" class="empty small">지출 내역이 없습니다.</div></section>
    <section class="panel"><h2>최근 거래</h2><div id="recentList"></div><div id="recentEmpty" class="empty small">거래 내역이 없습니다.</div></section>
  </div>
</section>

<section id="transactions" class="page">
<div class="content-grid">
<section class="panel form-panel">
<h2>거래 내역 추가</h2>
<form id="transactionForm">
<div class="type-toggle">
<label><input type="radio" name="type" value="expense" checked><span>지출</span></label>
<label><input type="radio" name="type" value="income"><span>수입</span></label>
</div>
<label>날짜<input id="date" type="date" required></label>
<label>카테고리<select id="category" required></select></label>
<label>내용<input id="description" placeholder="예: 점심 식사" maxlength="60" required></label>
<label>금액<input id="amount" type="number" min="1" step="1" placeholder="0" required></label>
<label>결제수단<select id="payment"><option>신용카드</option><option>체크카드</option><option>현금</option><option>계좌이체</option><option>기타</option></select></label>
<button class="primary">거래 추가</button>
</form>
</section>
<section class="panel">
<div class="list-head"><div><h2>거래 내역</h2><p id="monthLabel"></p></div>
<div class="filters"><input id="monthFilter" type="month"><select id="typeFilter"><option value="all">전체</option><option value="expense">지출</option><option value="income">수입</option></select><select id="categoryFilter"><option value="all">카테고리</option></select></div></div>
<div id="empty" class="empty">거래 내역이 없습니다.</div><div id="transactionList" class="transactions"></div>
</section>
</div>
</section>

<section id="debts" class="page">
<div class="debt-layout">
<section class="panel form-panel">
<h2>채무 등록</h2>
<p class="hint">빌린 돈 자체는 지출로 잡지 않고, 실제 상환할 때 지출로 기록합니다.</p>
<form id="debtForm">
<label>종류<select id="debtType"><option value="loan">금융기관 대출</option><option value="personal">개인 채무</option><option value="other">기타 채무</option></select></label>
<label>채권자<input id="creditor" placeholder="예: ○○은행 / 홍길동" required></label>
<label>채무명<input id="debtName" placeholder="예: 신용대출 / 빌린 돈" required></label>
<label>최초 원금<input id="principal" type="number" min="1" step="1" placeholder="0" required></label>
<label>메모<input id="debtMemo" placeholder="선택사항"></label>
<button class="primary">채무 등록</button>
</form>
</section>
<section class="panel">
<div class="debt-head"><div><h2>내 채무</h2><p>상환을 입력하면 잔여 원금이 자동으로 줄어듭니다.</p></div><strong id="allDebtTotal">₩0</strong></div>
<div id="debtList"></div><div id="debtEmpty" class="empty">등록된 채무가 없습니다.</div>
</section>
</div>
</section>
</div>
<script src="app.js"></script>
</body>
</html>
